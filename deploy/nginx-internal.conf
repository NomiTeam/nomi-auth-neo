server {
    listen 8443 ssl;
    server_name bot-auth.example.com;

    ssl_certificate /etc/ssl/nomi/server.pem;
    ssl_certificate_key /etc/ssl/nomi/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/ssl/nomi/client-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;
    error_page 495 496 =403 @client_certificate_required;

    location @client_certificate_required {
        default_type application/json;
        return 403 '{"code":"MTLS_REQUIRED","message":"Client certificate required"}';
    }

    location ^~ /internal/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Nomi-Client-Verify $ssl_client_verify;
    }

    location / { return 404; }
}
